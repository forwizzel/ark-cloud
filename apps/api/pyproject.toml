[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ark-cloud-api"
version = "0.9.0"
description = "Ark Cloud control plane API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "cryptography==46.0.5",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.5",
    "psutil==7.2.2",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.12.0",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.pytest.ini_options]
addopts = "-q"
cache_dir = "/tmp/ark-cloud-pytest"
testpaths = ["tests"]

[tool.ruff]
cache-dir = "/tmp/ark-cloud-ruff"
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.packages.find]
include = ["app*"]
