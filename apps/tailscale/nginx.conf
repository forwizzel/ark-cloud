worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 1024; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Serve matches the node hostname before forwarding. Normalize and validate
    # the forwarded host independently, without accepting arbitrary origins.
    map $host $ark_remote_host {
        default "";
        "~^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+ts\.net$" $host;
    }
    server {
        listen 127.0.0.1:8080;
        client_max_body_size 0;
        client_body_timeout 3600s;
        location = /_ark_controller_health {
            return 204;
        }
        location ^~ /api/admin/tailscale/controller {
            return 404;
        }
        location / {
            if ($ark_remote_host = "") { return 404; }
            set $web http://web:5173;
            proxy_pass $web;
            proxy_http_version 1.1;
            proxy_set_header Host localhost:5173;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Host $ark_remote_host;
            proxy_set_header X-Ark-Remote-Access __ARK_REMOTE_TOKEN__;
            proxy_hide_header X-Ark-Remote-Access;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
