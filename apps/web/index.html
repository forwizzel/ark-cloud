<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111b22" />
    <script>
      (() => {
        const saved = (key) => {
          try {
            return localStorage.getItem(key);
          } catch {
            return null;
          }
        };
        const themePreference = saved("ark-cloud-theme");
        const theme =
          themePreference === "dark" || themePreference === "light"
            ? themePreference
            : (window.matchMedia?.("(prefers-color-scheme: light)").matches ??
                false)
              ? "light"
              : "dark";
        const contrastPreference = saved("ark-cloud-contrast");
        const contrast =
          contrastPreference === "more" || contrastPreference === "normal"
            ? contrastPreference
            : (window.matchMedia?.("(prefers-contrast: more)").matches ?? false)
              ? "more"
              : "normal";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.contrast = contrast;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          contrast === "more"
            ? theme === "light"
              ? "#ffffff"
              : "#000000"
            : theme === "light"
              ? "#f2f5f2"
              : "#111b22";
      })();
    </script>
    <meta
      name="description"
      content="Ark Cloud private infrastructure control plane"
    />
    <title>Ark Cloud | Private control plane</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
