name: ark-cloud

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - data

  api:
    build:
      context: ./apps/api
    environment:
      ARK_DATABASE_URL: ${ARK_DATABASE_URL:?Copy .env.example to .env}
      ARK_ENVIRONMENT: ${ARK_ENVIRONMENT:-development}
      ARK_LOG_LEVEL: ${ARK_LOG_LEVEL:-INFO}
      ARK_SYSTEM_HOSTNAME: ${ARK_SYSTEM_HOSTNAME:-Ark}
      ARK_SYSTEM_OS_NAME: ${ARK_SYSTEM_OS_NAME:-Fedora Linux}
      ARK_SYSTEM_STORAGE_PATH: ${ARK_SYSTEM_STORAGE_PATH:-/}
      ARK_TAILSCALE_API_KEY: ${ARK_TAILSCALE_API_KEY:-}
      ARK_TAILSCALE_TAILNET: ${ARK_TAILSCALE_TAILNET:--}
      ARK_AUTH_USERNAME: ${ARK_AUTH_USERNAME:-}
      ARK_AUTH_PASSWORD_HASH: ${ARK_AUTH_PASSWORD_HASH:-}
      ARK_SESSION_SECRET: ${ARK_SESSION_SECRET:-}
      ARK_COOKIE_SECURE: ${ARK_COOKIE_SECURE:-false}
      ARK_GOOGLE_CLIENT_ID: ${ARK_GOOGLE_CLIENT_ID:-}
      ARK_GOOGLE_CLIENT_SECRET: ${ARK_GOOGLE_CLIENT_SECRET:-}
      ARK_GOOGLE_REDIRECT_URI: ${ARK_GOOGLE_REDIRECT_URI:-}
      ARK_GOOGLE_TOKEN_ENCRYPTION_KEY: ${ARK_GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      ARK_GOOGLE_STATUS_CACHE_SECONDS: ${ARK_GOOGLE_STATUS_CACHE_SECONDS:-300}
      PYTHONPATH: /app
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    volumes:
      - ./apps/api:/app:Z
    networks:
      - app
      - data

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    command: >-
      sh -c "LOCK_HASH=$$(sha256sum package-lock.json | cut -d ' ' -f 1);
      if [ \"$${LOCK_HASH}\" != \"$$(cat node_modules/.ark-lock-hash 2>/dev/null)\" ]; then
      npm ci && printf '%s' \"$${LOCK_HASH}\" > node_modules/.ark-lock-hash;
      fi;
      exec npm run dev -- --host 0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "${ARK_BIND_ADDRESS:-127.0.0.1}:${ARK_WEB_PORT:-5173}:5173"
    restart: unless-stopped
    volumes:
      - ./apps/web:/app:Z
      - ./graphics/arkcloud-logo.svg:/graphics/arkcloud-logo.svg:ro,Z
      - web_node_modules:/app/node_modules
    networks:
      - app

volumes:
  postgres_data:
  web_node_modules:

networks:
  app:
  data:
    internal: true
